name: Release

on:
  push:
    tags:
    - '*'

jobs:
  build:
    if: github.repository == 'jazzband/django-newsletter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Twine check
        run: uvx --from twine twine check dist/*

      - name: Upload packages to Jazzband
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: jazzband
          password: ${{ secrets.JAZZBAND_RELEASE_KEY }}
          repository-url: https://jazzband.co/projects/django-newsletter/upload

  github-release:
    if: github.repository == 'jazzband/django-newsletter'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the section of CHANGES.rst for this version as the release notes
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^[0-9]/ { if (found) exit; found = ($1 == v); skip = found; next }
            skip && /^-+$/ { skip = 0; next }
            found { print }
          ' CHANGES.rst | sed -e '/./,$!d' > notes.md

          # Add the new contributors and the compare link from GitHub's
          # generated notes, without its list of pull requests
          if [ -s notes.md ]; then
            { echo "## What's Changed"; cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md || true
            awk '
              /^## What.s Changed/ { skip = 1; next }
              /^## / || /^\*\*Full Changelog/ { skip = 0 }
              !skip { print }
            ' generated.md | sed -e '/./,$!d' > extra.md
            if [ -s extra.md ]; then
              printf '\n' >> notes.md
              cat extra.md >> notes.md
            fi
          fi

          flags=""
          if [[ "$GITHUB_REF_NAME" =~ [0-9](a|b|rc)[0-9]+$ ]]; then
            flags="--prerelease"
          fi
          if [ -s notes.md ]; then
            notes="--notes-file notes.md"
          else
            echo "No CHANGES.rst section for $version, generating notes instead"
            notes="--generate-notes"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            $notes \
            $flags
